name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # BAM/SAM 读写已迁移到纯 Rust 的 noodles（rust-htslib / gskits 已移除），
    # 构建不再依赖 bindgen / libclang / hts-sys / 系统 HTSlib 头文件。
    # 历史背景见 docs/ci-htslib-opaque-structs.md（已根治）。

    - name: Build
      run: cargo build --locked --verbose

    - name: Run unit tests
      run: cargo test --locked --lib --bins --verbose

    # 发布前校验：meta 信息不合法会在这一步直接失败，而不是在真实发布时
    - name: Verify crate can be packaged
      run: cargo package --locked --allow-dirty

    - name: Publish to crates.io
      run: cargo publish --locked
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
