name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # BAM/SAM 读写已迁移到纯 Rust 的 noodles（rust-htslib / gskits 已移除），
    # 构建不再依赖 bindgen / libclang / hts-sys / 系统 HTSlib 头文件。
    # 历史背景见 docs/ci-htslib-opaque-structs.md（已根治）。

    # --locked：强制使用提交里的 Cargo.lock，避免 runner 侧重新解析依赖版本
    - name: Build
      run: cargo build --locked --verbose

    # 只跑单测（lib/bin 内 #[test]），不含集成测试与 doc-test
    - name: Run unit tests
      run: cargo test --locked --lib --bins --verbose
